name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # Builds web-sized copies of any photo whose thumbnail is missing or out
      # of date (and
      # records its size in photos.json), so a new photo is light on the live
      # site even if tools/build_thumbs.py wasn't run before pushing.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build photo thumbnails
        run: |
          pip install pillow
          python tools/build_thumbs.py
      - name: Upload site (the inner "Personal Website" folder)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "Personal Website"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
